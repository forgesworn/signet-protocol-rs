[package]
name = "signet-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Rust implementation of the Signet identity protocol on Nostr: kind-21236 auth and kind-31000 credential event types and the NIP-01 canonical event id. Mirrors the signet-protocol npm package."
license = "MIT"
repository = "https://github.com/forgesworn/signet-protocol-rs"
homepage = "https://github.com/forgesworn/signet"
documentation = "https://docs.rs/signet-protocol"
keywords = ["nostr", "signet", "identity", "schnorr", "credential"]
categories = ["cryptography", "authentication"]
readme = "README.md"

[dependencies]
serde_json = "1.0"
sha2 = { version = "0.11", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
